<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearthreaver — Batraciens</title>
<style>body{margin:0;background:#171d23;color:#eadfc8;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 12px;font-size:27px}p,small{color:#b8bebc}section{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:6px;font-size:13px}select,button,input{background:#2a333e;color:#eee0c8;border:1px solid #65717a;padding:10px;border-radius:4px;font:inherit}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#35434d}#status{min-height:24px}a{color:#e5b871}button{cursor:pointer}</style>
<main><h1>Hearthreaver · Batraciens</h1><p>Sources approuvées, quatre vues indépendantes. Seules les nuances de peau et de ventre changent.</p><section><label>Personnage<select id="kind"><option value="male">Civil mâle</option><option value="female">Civile femelle</option><option value="armed">Combattant mâle</option></select></label><label>Rôle<select id="role"></select></label><label>Palette<select id="palette"></select></label><label>Animation<select id="action"></select></label><label>Vitesse<select id="speed"><option value="0.25">×0,25</option><option value="0.5">×0,5</option><option value="1" selected>×1</option></select></label></section><canvas id="view" width="960" height="280"></canvas><section><button id="play">Pause</button><button id="restart">Rejouer</button><button id="step">Image suivante</button><label>Image<input id="frame" type="range" min="0" value="0"></label><label><input id="anchor" type="checkbox"> Ancrage au sol</label></section><p id="status"></p><small>Case 80 × 80 · Ancre (40, 52) · Agrandissement entier ×5 · Aucun lissage. La mort conserve sa dernière pose.</small><p><a href="../docs/batraciens.md">Implantations et règles d’intégration</a></p></main>
<script src="../sprites/batraciens/batraciens-complet.js"></script><script src="../sprites/batraciens/batraciens-combattants.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),C=HearthreaverBatraciens,A=HearthreaverBatraciensCombattants,cv=$('view'),ctx=cv.getContext('2d'),dirs=['face','droite','dos','gauche'];let atlas,api,seconds=0,index=0,playing=true,last=performance.now();
for(const[k,v]of Object.entries(A.ROLES))$('role').add(new Option(v.label,k));
function reset(rebuild=false){const armed=$('kind').value==='armed',sex=$('kind').value==='female'?'female':'male',oldAction=$('action').value;api=armed?A:C;if(atlas)atlas.clear();$('role').disabled=!armed;if(rebuild){$('palette').replaceChildren();for(const p of ['original',...(sex==='female'?['rose_mauve','lilas','prune_rose','corail_doux']:['jade','turquoise_sombre','ocre_mousse','ardoise'])])$('palette').add(new Option(p.replaceAll('_',' '),p));if(sex==='female')$('palette').value='rose_mauve';$('action').replaceChildren();for(const[k,v]of Object.entries(api.CLIPS))$('action').add(new Option(v.label,k));if(api.CLIPS[oldAction])$('action').value=oldAction;}
atlas=armed?new A.Atlas({role:$('role').value,palette:$('palette').value,maxFrames:64}):new C.Atlas({sex,palette:$('palette').value,maxFrames:64});seconds=0;index=0;$('frame').max=api.CLIPS[$('action').value].frames-1;}
$('kind').onchange=()=>reset(true);for(const k of ['role','palette','action'])$(k).onchange=()=>reset();$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Lecture';};$('restart').onclick=()=>{seconds=0;index=0;};$('step').onclick=()=>{playing=false;$('play').textContent='Lecture';index=(index+1)%api.CLIPS[$('action').value].frames;};$('frame').oninput=()=>{playing=false;$('play').textContent='Lecture';index=+$('frame').value;};reset(true);
function draw(now){const dt=Math.max(0,Math.min(.1,(now-last)/1000));last=now;if(playing)seconds+=dt*+$('speed').value;const action=$('action').value;if(playing)index=api.frameAt(action,seconds);$('frame').value=index;ctx.fillStyle='#35434d';ctx.fillRect(0,0,960,280);ctx.imageSmoothingEnabled=false;for(let j=0;j<4;j++){const x=120+j*240,y=200;const im=atlas.get(action,dirs[j],index,{scene:true,catch:false});ctx.drawImage(im,x-40*5,y-52*5,400,400);if($('anchor').checked){ctx.fillStyle='#b7bbb5';ctx.fillRect(x-12,y,25,1);ctx.fillRect(x,y-12,1,25);}ctx.font='15px system-ui';ctx.fillStyle='#ecdbbd';ctx.textAlign='center';ctx.fillText(['Face','Droite','Dos','Gauche'][j],x,253);}const clip=api.CLIPS[action];$('status').textContent=clip.label+' · image '+(index+1)+' / '+clip.frames+' · '+(clip.loop?'boucle':'pose finale maintenue');requestAnimationFrame(draw);}requestAnimationFrame(draw);
})();
</script></html>
