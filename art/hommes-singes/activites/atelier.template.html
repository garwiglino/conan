<div id="ape-activity-workshop">
<style>
#ape-activity-workshop{--ape-bg:#211b20;--ape-ink:#efdbad;--ape-line:#88653d;background:var(--ape-bg);color:var(--ape-ink);font:15px/1.4 system-ui;max-width:1080px;margin:auto;padding:16px}#ape-activity-workshop h2{font-size:21px;margin:0 0 12px}#ape-activity-workshop .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:end}#ape-activity-workshop label{display:flex;flex-direction:column;gap:3px}#ape-activity-workshop select,#ape-activity-workshop button{font:inherit;color:var(--ape-ink);background:#382b2b;border:1px solid var(--ape-line);padding:8px;min-height:44px;max-width:100%;touch-action:manipulation}#ape-activity-workshop .views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}#ape-activity-workshop figure{margin:0;text-align:center;background:#2e272b}#ape-activity-workshop canvas{display:block;width:100%;height:auto;image-rendering:pixelated}#ape-activity-workshop figcaption{padding:4px}#ape-activity-workshop .status{min-height:2.8em;color:#d1bc94}#ape-activity-workshop .toggles{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}#ape-activity-workshop .toggles label{flex-direction:row;align-items:center;min-height:44px}#ape-activity-workshop input{accent-color:#bc965f}#ape-activity-workshop .marks{height:8px;display:flex;gap:3px;margin:10px 0}#ape-activity-workshop .marks i{flex:1;background:#564637}#ape-activity-workshop .marks i.on{background:#e0bc79}#ape-activity-workshop .marks i.contact{box-shadow:inset 0 -3px #c77853}#ape-activity-workshop .warning{font-size:13px;color:#bcaa8c}@media(max-width:600px){#ape-activity-workshop .views{grid-template-columns:repeat(2,minmax(0,1fr))}#ape-activity-workshop .tools label{flex:1 1 130px;min-width:0}#ape-activity-workshop{padding:10px}}
</style>
<h2>Hearthreaver · Tenues, métiers et combat</h2>
<div class="tools"><label>Fonction<select data-role></select></label><label>Activité<select data-action></select></label><label>Corps<select data-sex><option value="male">Masculin</option><option value="female">Féminin</option></select></label><label>Pelage<select data-tone></select></label><button type="button" data-play>Pause</button><button type="button" data-step>Image suivante</button></div>
<div class="toggles"><label><input type="checkbox" data-outfit checked>Tenue et coiffe</label><label><input type="checkbox" data-equipment checked>Outils / armes</label><label><input type="checkbox" data-scene checked>Poste de travail</label><label><input type="checkbox" data-smear checked>Smears</label><label><input type="checkbox" data-repeat checked>Répéter les gestes</label><label>Vitesse<input type="range" data-speed min="25" max="150" value="100"></label></div>
<div class="views"><figure><canvas width="80" height="80" data-dir="face" role="img" aria-label="Animation de face"></canvas><figcaption>Face</figcaption></figure><figure><canvas width="80" height="80" data-dir="droite" role="img" aria-label="Profil droit animé"></canvas><figcaption>Droite</figcaption></figure><figure><canvas width="80" height="80" data-dir="dos" role="img" aria-label="Animation de dos"></canvas><figcaption>Dos</figcaption></figure><figure><canvas width="80" height="80" data-dir="gauche" role="img" aria-label="Profil gauche animé"></canvas><figcaption>Gauche</figcaption></figure></div>
<div class="marks" data-marks></div><div class="status" data-status></div><div class="warning" data-description></div>
<script>
/* APE_SOURCES */
(()=>{const root=document.getElementById('ape-activity-workshop'),A=HearthreaverApeActivities,$=s=>root.querySelector(s),role=$('[data-role]'),action=$('[data-action]'),sex=$('[data-sex]'),tone=$('[data-tone]'),canvases=[...root.querySelectorAll('canvas')],marks=$('[data-marks]');let playing=true,time=0,last=0,frame=0;
for(const [id,v]of Object.entries(A.ROLE_INFO)){const o=document.createElement('option');o.value=id;o.textContent=v.label;role.append(o);}for(const [id,v]of Object.entries(A.Base.TONES)){const o=document.createElement('option');o.value=id;o.textContent=v.label;tone.append(o);}
function actions(preferred){const own=A.ROLE_INFO[role.value].activities,groups={};action.replaceChildren();for(const [id,c]of Object.entries(A.CLIPS)){const key=own.includes(id)?'Fonction sélectionnée':c.family==='combat'?'Combat':c.family==='work'||c.family==='care'?'Autres métiers':'Vie et déplacements';let g=groups[key];if(!g){g=document.createElement('optgroup');g.label=key;groups[key]=g;action.append(g);}const o=document.createElement('option');o.value=id;o.textContent=c.label;g.append(o);}action.value=preferred||own[0];reset();}
function reset(){time=0;frame=0;marks.replaceChildren();const c=A.CLIPS[action.value];for(let i=0;i<c.frames;i++){const b=document.createElement('i');b.classList.toggle('contact',c.markers.some(m=>m.frame===i));marks.append(b);}paint();}
function paint(){const id=action.value,c=A.CLIPS[id];for(const cv of canvases){const ctx=cv.getContext('2d');ctx.clearRect(0,0,80,80);A.draw(ctx,{action:id,frame,dir:cv.dataset.dir,role:role.value,sex:sex.value,tone:tone.value,outfit:$('[data-outfit]').checked,equipment:$('[data-equipment]').checked,scene:$('[data-scene]').checked,smear:$('[data-smear]').checked});}for(let i=0;i<marks.children.length;i++)marks.children[i].classList.toggle('on',i===frame);const marker=c.markers.filter(m=>m.frame===frame).map(m=>m.id).join(', ');$('[data-status]').textContent=c.label+' · '+(frame+1)+' / '+c.frames+(marker?' · '+marker:'')+(c.loop?' · boucle':' · geste à fin fixe');$('[data-description]').textContent=A.ROLE_INFO[role.value].outfitBrief+(c.navigationRequired?' · Le déplacement réel dépend du parcours et des collisions du jeu.':'');}
role.onchange=()=>actions();action.onchange=reset;for(const el of root.querySelectorAll('input,select'))if(el!==role&&el!==action)el.onchange=paint;$('[data-play]').onclick=()=>{playing=!playing;$('[data-play]').textContent=playing?'Pause':'Lecture';};$('[data-step]').onclick=()=>{playing=false;$('[data-play]').textContent='Lecture';frame=(frame+1)%A.CLIPS[action.value].frames;paint();};actions('harvest_fruit');function tick(now){if(last&&playing){time+=(now-last)/1000*Number($('[data-speed]').value)/100;const c=A.CLIPS[action.value];frame=A.frameAt(action.value,$('[data-repeat]').checked?time%c.duration:time);paint();}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);})();
</script></div>
