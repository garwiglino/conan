<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearthreaver — Humains animés</title>
<style>body{margin:0;background:#1b242c;color:#e8d9bf;font:16px system-ui}main{max-width:1100px;margin:auto;padding:26px}h1{font-size:28px;margin:0 0 8px}p{color:#b9b8b0}section{display:flex;gap:14px;flex-wrap:wrap;margin:22px 0}label{display:grid;gap:6px;font-size:13px;color:#d1b17c}select,button,input{accent-color:#d3aa6c;background:#303d47;color:#eee0c8;border:1px solid #6e6b60;border-radius:4px;padding:9px;font:inherit}button{cursor:pointer}canvas{width:100%;image-rendering:pixelated;background:#273640;border:1px solid #53606a}small{color:#b9b8b0}#status{min-height:20px}a{color:#dec496}</style>
<main><h1>Hearthreaver — Humains animés</h1><p>Tenues, coiffures et couvre-chefs indépendants. Quatre directions, gestes civils et activités de métier.</p>
<section><label>Tenue<select id="outfit"></select></label><label>Mouvement<select id="action"></select></label><label>Coiffure<select id="hair"></select></label><label>Couleur<select id="color"></select></label><label>Visage<select id="age"><option value="adulte">Adulte</option><option value="mur">Mûr</option><option value="age">Âgé</option></select></label><label>Couvre-chef<select id="hat"><option value="yes">Coordonné à la tenue</option><option value="no">Sans couvre-chef</option></select></label><label>Barbe<select id="beard"><option value="">Aucune</option></select></label><label>Moustache<select id="moustache"><option value="">Aucune</option></select></label></section>
<canvas id="view" width="1100" height="300"></canvas><section><button id="play">Pause</button><button id="restart">Rejouer</button><button id="step">Image suivante</button><label>Image<input id="frame" type="range" min="0" value="0"></label></section><p id="status">Chargement des personnages…</p><small>Grossissement ×7 sans lissage. La marche est synchronisée sur la distance en jeu. La mort s’arrête sur sa dernière pose.</small></main>
<script>
(async()=>{
 const $=id=>document.getElementById(id),names={idle:'Attente',walk:'Marche',flee:'Fuite effrayée',startle:'Sursaut',talk:'Dialogue',sit_down:'S’asseoir',seated:'Repos assis',stand_up:'Se relever',cower:'Se protéger',hit:'Coup reçu',death:'Mort',carry:'Porter une charge',hoe:'Travailler la terre',sow:'Semer',craft:'Travailler à l’établi',pottery:'Façonner une poterie',weave:'Tresser un panier',stir:'Remuer une teinture',net:'Réparer un filet',groom:'Brosser un cheval',load:'Soulever une charge',rope:'Manier les cordages',ledger:'Consulter le registre'};
 window.CIVILIAN_ART=await(await fetch('../data/civilians/atlas.json')).json();window.Renderer=function(){};Renderer.prototype.npcDraw=()=>{};
 (0,eval)((await(await fetch('../scripts/civilian-art.js')).text())+';window.previewAtlas=CIVILIAN_BITMAPS;');
 const art=window.CIVILIAN_ART,atlas=window.previewAtlas,cv=$('view'),c=cv.getContext('2d');c.imageSmoothingEnabled=false;
 for(const o of Object.values(art.outfits))$('outfit').add(new Option(o.label+' · '+(o.sex==='feminin'?'femme':'homme')+' · '+o.palette,o.id));
 for(const [id,label]of Object.entries({brun:'Brun',noir:'Noir',chatain:'Châtain',roux:'Roux',blond:'Blond',argente:'Argenté'}))$('color').add(new Option(label,id));
 for(let i=1;i<=6;i++)$('beard').add(new Option('Barbe '+i,'B0'+i));for(let i=1;i<=5;i++)$('moustache').add(new Option('Moustache '+i,'M0'+i));
 let appearance,seconds=0,last=performance.now(),playing=true,index=0,revision=0;
 async function update(resetOutfit=false){const o=art.outfits[$('outfit').value];if(resetOutfit){const old=$('action').value;$('action').replaceChildren();for(const id of Object.keys(o.frames))$('action').add(new Option(names[id],id));$('action').value=o.frames[old]?old:'idle';$('hair').replaceChildren();const styles=o.cut.startsWith('E')?(o.sex==='feminin'?['07','08']:['06','14']):o.sex==='feminin'?['01','02','03','04','05']:['01','02','05','06','07','08','09','10','11','12','13','14'];for(const style of styles)$('hair').add(new Option('Coupe '+style,style));}
  const old=$('age').value==='age';if(old)$('color').value='argente';$('color').disabled=old;$('beard').disabled=$('moustache').disabled=o.sex==='feminin';$('hat').disabled=!o.hat;
  appearance={sex:o.sex,outfit:o.id,age:$('age').value,hair:$('hair').value,color:$('color').value,hat:$('hat').value==='yes'?o.hat:null,beard:o.sex==='masculin'?$('beard').value||null:null,moustache:o.sex==='masculin'?$('moustache').value||null:null};
  seconds=0;index=0;const r=++revision;$('status').textContent='Chargement…';await atlas.preload(appearance);if(r===revision)$('status').textContent=o.label+' — '+names[$('action').value];$('frame').max=art.clips[$('action').value].durations.length-1;
 }
 $('outfit').onchange=()=>update(true);for(const id of ['action','hair','color','age','hat','beard','moustache'])$(id).onchange=()=>update();
 $('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Lecture';};$('restart').onclick=()=>{seconds=0;index=0;};$('step').onclick=()=>{playing=false;$('play').textContent='Lecture';index=(index+1)%art.clips[$('action').value].durations.length;};$('frame').oninput=()=>{playing=false;$('play').textContent='Lecture';index=+$('frame').value;};
 await update(true);
 function draw(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)seconds+=dt;const id=$('action').value,clip=art.clips[id],total=clip.durations.reduce((a,b)=>a+b,0);if(playing){let ms=seconds*1000;ms=clip.loop?ms%total:Math.min(ms,total-1);index=0;while(index<clip.durations.length-1&&ms>=clip.durations[index])ms-=clip.durations[index++];}$('frame').value=index;
  c.fillStyle='#273640';c.fillRect(0,0,cv.width,cv.height);for(let j=0;j<4;j++){const x=135+j*275;c.fillStyle='#1b2931';c.beginPath();c.ellipse(x,235,38,10,0,0,Math.PI*2);c.fill();const im=atlas.get(appearance,id,[2,1,0,3][j],index);if(im)c.drawImage(im,x-40*7,235-52*7,560,560);c.fillStyle='#e3c69a';c.font='16px system-ui';c.textAlign='center';c.fillText(['Face','Droite','Dos','Gauche'][j],x,275);}requestAnimationFrame(draw);
 }requestAnimationFrame(draw);
})().catch(e=>document.getElementById('status').textContent=e.message);
</script></html>
