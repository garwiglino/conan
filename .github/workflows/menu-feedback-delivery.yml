name: Verify Hearthreaver menu and feedback
on:
  push:
    branches: [codex/hearthreaver-menu-feedback]
    paths: [.github/workflows/menu-feedback-delivery.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the locally tested patch
        env:
          GAME_PATCH: 
        run: |
          python3 - <<'PYCODE'
          import base64,os,subprocess,zlib
          patch=zlib.decompress(base64.b64decode(os.environ['GAME_PATCH']))
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PYCODE
      - name: Verify exact source hashes
        run: |
          python3 - <<'PYCODE'
          import subprocess
          expected={'README.md': '68cf4b93aa072111344b805099dcaf4876b98264', 'audio/ui-back.mid': '67db2de2d31b2006bf978f83adc65d99db2d590e', 'audio/ui-confirm.mid': '36afd864c31d2d1d46564a8c796e30a15d6ae1b5', 'audio/ui-cues.json': '7100a2aa90c9ccf658074f23c59ab5032dbe7658', 'audio/ui-open.mid': 'acf1e6111ab96358dff11aec6f5a8601373b66e1', 'audio/ui-select.mid': 'e6e015e900a00e8c9adce6a3a102415c9acf3ef9', 'index.html': '72a6220dd1c4fd3a777e544b6acb353bfc7eaea2', 'ios/Hearthreaver.xcodeproj/project.pbxproj': '917311c7d25af6816efc45dc9c9126385ed080c1', 'ios/Hearthreaver/Game/index.html': '73779b18f15d46a67fabf6726ea7b847351e7aa0', 'ios/Hearthreaver/GameViewController.swift': '86e6353deb873480c3b61771736d656723fda09d', 'ios/LISEZMOI.md': '53d79d9f20f0601c9fba847d899ab9eabd1b5410', 'package.json': 'f06f5534dfd734e083b56e19e8b6e1fc83ca73ad', 'scripts/build-ui-cues.cjs': '29fcf8d392bfc9755b44852554206405fc0008fc', 'scripts/title-menu.html': '78a623fe60db1fa0a0d9c526cd615f70eb2939d7', 'scripts/title-menu.js': 'f331a5c460d10c277d8d035793b3acc60ed1207f', 'scripts/title.css': 'dac63cad5fb41f6014407f3a111e1dfaa37fd25d', 'tests/feedback.test.cjs': 'c20942d75e1753ba71fca0c16ccf2fc0cd0449c6', 'tests/game-harness.cjs': 'a3d5c27d20a1adbd20bca0d65fd074b0985151d8', 'tests/menu.test.cjs': 'ea637d96a5dd91335270eec5d0646e4230b39fd4', 'tests/music.test.cjs': 'caf8960c8e7984157ce1b34caa6e0fb67b849926', 'tests/quests.test.cjs': 'f23fd8bbf995e395a287d07530d9cb4fb441c9d7'}
          for path,sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha, (path,actual,sha)
          print('All source files match the locally tested version.')
          PYCODE
      - name: Run all game tests
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test
      - name: Compile the iOS app and its native haptic bridge
        run: xcodebuild -quiet -project ios/Hearthreaver.xcodeproj -scheme Hearthreaver -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/hearthreaver-build CODE_SIGNING_ALLOWED=NO build
      - name: Package the verified iOS sources and fallback game
        run: python3 scripts/package-ios.py
      - name: Save verified files on the delivery branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Hearthreaver-iOS.zip README.md audio/ui-back.mid audio/ui-confirm.mid audio/ui-cues.json audio/ui-open.mid audio/ui-select.mid index.html ios/Hearthreaver.xcodeproj/project.pbxproj ios/Hearthreaver/Game/index.html ios/Hearthreaver/GameViewController.swift ios/LISEZMOI.md package.json scripts/build-ui-cues.cjs scripts/title-menu.html scripts/title-menu.js scripts/title.css tests/feedback.test.cjs tests/game-harness.cjs tests/menu.test.cjs tests/music.test.cjs tests/quests.test.cjs
          git commit -m 'Verify quest menu, MIDI cues and native haptics'
          git push origin HEAD:codex/hearthreaver-menu-feedback
