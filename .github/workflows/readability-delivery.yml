name: Transfer locally tested Hearthreaver update
on:
  push:
    branches: [codex/hearthreaver-readability]
    paths: [.github/workflows/readability-delivery.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.event.head_commit.message == 'Transfer locally tested readability update'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the locally tested changes
        env:
          GAME_PATCH: 
        run: |
          python3 - <<'PYCODE'
          import base64,os,subprocess,zlib
          patch=zlib.decompress(base64.b64decode(os.environ['GAME_PATCH']))
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PYCODE
      - name: Refresh the iOS source archive
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('Hearthreaver-iOS.zip','w',ZIP_DEFLATED,compresslevel=9) as archive:
              for source in sorted(Path('ios').rglob('*')):
                  if source.is_file() and not any(part in {'xcuserdata','.DS_Store'} for part in source.parts):
                      archive.write(source,'Hearthreaver-iOS/'+source.relative_to('ios').as_posix())
          PYCODE
      - name: Transfer updated game files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Hearthreaver-iOS.zip README.md index.html ios/Hearthreaver/Game/index.html scripts/embed-title.cjs scripts/readability.css scripts/text-layout.js scripts/title-menu.html scripts/title-menu.js tests/game-harness.cjs tests/menu.test.cjs tests/text-layout.test.cjs
          git commit -m 'Transfer improved dialogue icons and adjustable typography'
          git push origin HEAD:codex/hearthreaver-readability
