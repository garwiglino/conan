name: Batraciens - vie locale
on:
  push:
    branches: [integration/batraciens-social]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: batraciens-social-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact, verified local-life patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '85a13f90fb5b5e9fea9192c553caa751d1d1cfd0d33b14d0e95c12d8efa4884e' '.github/batraciens-social-payload/patch.br' | sha256sum -c -
          node - <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const compressed = fs.readFileSync('.github/batraciens-social-payload/patch.br');
          const patch = zlib.brotliDecompressSync(compressed);
          const checksum = crypto.createHash('sha256').update(patch).digest('hex');
          if (checksum !== '3d8bf47e497d7211600f1944e05a05e7bfa69f2330c4503d29a4c108bc330b2b') throw new Error('Wrong patch digest');
          fs.writeFileSync('/tmp/batraciens-social.patch', patch);
          NODE
          git apply --check /tmp/batraciens-social.patch
          git apply /tmp/batraciens-social.patch
          printf '%s  %s\n' 'bd0bb10c345691c54b13d0459b774d65e79e09e4d2217870338310368544bf58' 'index.html' | sha256sum -c -
          printf '%s  %s\n' '3f9e47995d73cf26ad475bebd628e958c232ffbc4e88a63dfbcf44963ff52ca9' 'scripts/batraciens-society.js' | sha256sum -c -
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Rebuild web and offline iOS
        run: npm run build:batraciens
      - name: Test full game regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 --test-reporter=tap tests/*.test.cjs | tee /tmp/social-regression.log
      - name: Validate world and package iOS
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-world-bible.py
          python3 scripts/package-ios.py
          printf '%s  %s\n' 'bd0bb10c345691c54b13d0459b774d65e79e09e4d2217870338310368544bf58' 'index.html' | sha256sum -c -
          before=$(sha256sum index.html | cut -d' ' -f1)
          node scripts/build-batraciens.cjs
          test "$before" = "$(sha256sum index.html | cut -d' ' -f1)"
          grep -q 'BatracienSociety' ios/Hearthreaver/Game/index.html
      - name: Push tested update to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/batraciens-social-payload .github/workflows/batraciens-social.yml
          git add README.md docs/batraciens.md data/batraciens/communities.json data/batraciens/build-manifest.json scripts/batraciens-runtime.js scripts/batraciens-society.js scripts/build-batraciens.cjs scripts/embed-world.cjs tests/batraciens-society.test.cjs tests/batraciens.test.cjs index.html ios/Hearthreaver/Game/index.html Hearthreaver-iOS.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: batracien village life, travelers, talks and guard retaliation'
          git push origin HEAD:integration/batraciens-social
          git rev-parse HEAD
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batraciens-social-validation
          path: /tmp/social-regression.log
          retention-days: 14