name: Verify Hearthreaver quest delivery
on:
  push:
    branches: [codex/hearthreaver-quest-delivery]
    paths: [.github/workflows/quest-delivery.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the locally tested quest patch
        env:
          QUEST_PATCH: 
        run: |
          python - <<'PYCODE'
          import base64,os,subprocess,zlib
          patch=zlib.decompress(base64.b64decode(os.environ['QUEST_PATCH']))
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PYCODE
      - name: Verify exact source hashes
        run: |
          python - <<'PYCODE'
          import subprocess
          expected={'index.html': 'be41dcced2cc8445f09a41ac57f29ed32dd4bebc', 'ios/Hearthreaver/Game/index.html': 'ee296ee6e46f888967129c1ef0becb5bafa96bb5', 'README.md': '0a8d4168b3023ce08861b24d2b0aa4277ddcbf3e', 'tests/menu.test.cjs': '3ab96207a0ec65eef8d2b85e5a465d53650b3ff4', 'tests/quests.test.cjs': '23428c19aecfea56351bc1906169373300bfed42'}
          for path,sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha, (path,actual,sha)
          print('All five text files match the locally tested source.')
          PYCODE
      - name: Run the game tests
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test
      - name: Package the iOS fallback
        run: python scripts/package-ios.py
      - name: Save the verified files on the delivery branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ios/Hearthreaver/Game/index.html README.md tests/menu.test.cjs tests/quests.test.cjs Hearthreaver-iOS.zip
          git commit -m 'Verify quest guidance, snapping tracker and private NPC tents'
          git push origin HEAD:codex/hearthreaver-quest-delivery
